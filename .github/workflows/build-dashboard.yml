name: build-dashboard

# Mantém o cockpit honesto: valida frentes, obrigações, implantação, briefings e produtos
# contra os schemas, regenera data.json e roda a GUARDA DE CONFIDENCIALIDADE. Falha o CI
# se qualquer arquivo for inválido ou se termo proibido aparecer no bundle publicável.
#
# SEM FILTRO DE `paths`, de propósito. Havia um, listando frentes/ + dashboard/ + o script —
# e ele não cobria ferramentas/, briefings/, implantacao/, produtos/ nem radar/. Ou seja: a
# guarda que existe para impedir vazamento não rodava justamente nas mudanças com mais
# chance de introduzir um. Filtro de caminho precisa ser mantido em sincronia com cada
# domínio novo, e foi exatamente isso que falhou. O job leva ~7s; não vale o risco.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar frentes e gerar data.json
        run: node scripts/build-dashboard.mjs
      - name: Publicar data.json como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: dashboard/data.json
