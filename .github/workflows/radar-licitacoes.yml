name: radar-licitacoes

# Varre o PNCP semanalmente e commita as oportunidades que se enquadram com a Samais.
# Segunda-feira, 09:10 UTC (~06:10 em Brasília) — o edital da semana já publicado.

on:
  schedule:
    - cron: "10 9 * * 1"
  workflow_dispatch:
    inputs:
      dias:
        description: "Tamanho da janela de varredura (dias)"
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: radar-licitacoes
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Varrer o PNCP
        id: radar
        run: node scripts/radar-licitacoes.mjs --dias "${{ inputs.dias || '7' }}"

      # Captação sozinha não vira inteligência: acumula na memória de mercado, que
      # re-aplica os filtros atuais a TODO o histórico.
      - name: Indexar o mercado (memória acumulada)
        run: node scripts/indexar-mercado.mjs

      - name: Regerar o pacote do dashboard
        run: node scripts/build-dashboard.mjs

      - name: Commitar a captação da semana
        run: |
          ALVOS="radar/semanas inteligencia/mercado dashboard/data.json"
          if [ -z "$(git status --porcelain $ALVOS)" ]; then
            echo "Nada novo no radar — sem commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $ALVOS
          git commit -m "chore(radar): captação semanal do PNCP + índice de mercado [skip ci]"
          git push
