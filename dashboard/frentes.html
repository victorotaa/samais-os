<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="./marca-icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./marca-icone-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Samais-OS">
<meta name="mobile-web-app-capable" content="yes">
<title>Samais-OS · Cockpit de Frentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./samais.css">
<style>
  /* tokens: doutrina/samais.css (canônico) */
*{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);line-height:1.6;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  .back{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--text-3);padding:16px 0 0;text-decoration:none}
  .back:hover{color:var(--gold)}
  header{border-bottom:1px solid var(--border);padding:6px 0 28px}
  .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dim)}
  h1{font-family:var(--f-display);font-weight:800;font-size:34px;margin:10px 0 6px;letter-spacing:-.01em}
  .sub{color:var(--text-3);font-size:14px}
  .sub b{color:var(--text-2);font-weight:500}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:32px 0}
  .kpi{background:linear-gradient(180deg,var(--card),var(--card-2));border:1px solid var(--border-soft);border-radius:14px;padding:20px}
  .kpi .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
  .kpi .val{font-family:var(--f-display);font-weight:700;font-size:28px;margin-top:8px;color:var(--gold)}
  .kpi .val small{font-size:14px;color:var(--text-2);font-weight:500}
  /* Frentes */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 14px}
  .sec-head h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
  .sec-head .note{font-family:var(--f-mono);font-size:11px;color:var(--text-3)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .fr{background:var(--card);border:1px solid var(--border-soft);border-radius:14px;padding:18px 18px 16px;transition:border-color .2s,transform .2s}
  .fr:hover{border-color:var(--border);transform:translateY(-2px)}
  .fr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .fr-name{font-family:var(--f-display);font-weight:700;font-size:17px}
  .fr-uf{font-family:var(--f-mono);font-size:11px;color:var(--text-3)}
  .fr-serv{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--gold-dim);
    border:1px solid var(--border);border-radius:999px;padding:2px 9px;margin-top:8px}
  .fr-val{font-family:var(--f-mono);font-size:20px;color:var(--gold);margin:14px 0 2px}
  .fr-val.na{color:var(--text-3);font-size:14px}
  .fr-val small{font-size:11px;color:var(--text-3)}
  .fr-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
  .stage{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:6px;border:1px solid var(--border-soft)}
  .stage[data-s="radar"]{color:var(--text-3)}
  .stage[data-s="varredura"],.stage[data-s="estudo"]{color:var(--amber);border-color:rgba(221,141,12,.28)}
  .stage[data-s="proposta"],.stage[data-s="negociacao"]{color:var(--gold);border-color:var(--border)}
  .stage[data-s="contratado"]{color:var(--gold);border-color:rgba(184,149,78,.45);
    background:rgba(184,149,78,.09)}
  .stage[data-s="contrato-ativo"]{color:var(--green);border-color:rgba(95,140,106,.35)}
  /* implantação contratada: contagem regressiva ao lado do estágio */
  .impl{font-family:var(--f-mono);font-size:11px;color:var(--gold);border:1px solid rgba(184,149,78,.35);
    border-radius:6px;padding:3px 8px;white-space:nowrap}
  .impl small{color:var(--text-3)}
  .stage[data-s="arquivada"]{color:var(--text-3);opacity:.6}
  /* gauge */
  .gauge{display:flex;align-items:center;gap:8px}
  .gauge .bar{width:64px;height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
  .gauge .fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
  .gauge .n{font-family:var(--f-mono);font-size:12px;color:var(--text-2)}
  .verdict{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .verdict[data-v="go"]{color:var(--green)} .verdict[data-v="atencao"]{color:var(--amber)} .verdict[data-v="no-go"]{color:var(--red)}
  .next{color:var(--text-3);font-size:12.5px;margin-top:12px;border-top:1px solid var(--border-soft);padding-top:10px}
  .next b{color:var(--text-2);font-weight:500}
  footer{border-top:1px solid var(--border);margin-top:48px;padding:22px 0 44px;color:var(--text-3);font-family:var(--f-mono);font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .err{background:rgba(194,13,47,.08);border:1px solid rgba(194,13,47,.3);border-radius:12px;padding:18px;color:#e79aa8;font-family:var(--f-mono);font-size:13px;margin:32px 0}
  @media(max-width:720px){
    .kpis{grid-template-columns:repeat(2,1fr)}h1{font-size:27px}
    /* estágio + badge de implantação + gauge não cabem em uma linha a 390px:
       a linha quebra em vez de estourar a viewport. */
    .fr-row{flex-wrap:wrap;justify-content:flex-start}
    .gauge{flex:1 1 100%}
  }

/* ── material liquid glass (doutrina/samais.css) ──
   Recipe canônica, idêntica à dos estudos e do ROTA. A REFRAÇÃO (url(#glassDistort))
   é o que separa liquid glass de "card borrado": distorce o fundo atrás do vidro.
   Chromium aplica; os demais ignoram a url() e ficam no blur — degrada sozinho. */
.kpi,.fr{
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur) url(#glassDistort);
  border:var(--glass-border);
  box-shadow:var(--glass-shadow);
  overflow:hidden;
}
@media(max-width:720px){
  /* sem refração no celular: custa GPU e não se vê a 390px */
  .kpi,.fr{-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
}
@media (prefers-reduced-transparency: reduce){
  .kpi,.fr{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--s1)}
}
/* escape do material: conteúdo largo (tabela, gráfico) rola DENTRO do vidro em vez de
   ser clipado pelo overflow:hidden. Precisa vir DEPOIS do material para vencer. */
.rolavel{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>

<!-- refração do liquid glass · doutrina/glass-filter.html -->
<svg width="0" height="0" aria-hidden="true" focusable="false"
     style="position:absolute;pointer-events:none">
  <filter id="glassDistort" x="-20%" y="-20%" width="140%" height="140%"
          color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="1.1" result="nb"/>
    <feDisplacementMap in="SourceGraphic" in2="nb" scale="12" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="topbar barra-vidro">
  <a class="marca" href="./index.html" aria-label="Samais-OS">
    <span class="nome">samais</span><span class="sep">·</span><span class="desc">OS</span>
    <span class="mono-sa">SA+</span>
  </a>
  <nav class="topnav-links">
    <a href="./index.html">Início</a>
    <a href="./frentes.html" aria-current="page">Frentes</a>
    <a href="./implantacao.html">Implantação</a>
    <a href="./radar.html">Radar</a>
    <a href="./mercado.html">Mercado</a>
    <a href="./obrigacoes.html">Obrigações</a>
    <a href="./despesas/">Despesas</a>
  </nav>
</div>
<header><div class="wrap">
  <div class="kicker">Samais-OS · negócio como código</div>
  <h1>Cockpit de Frentes</h1>
  <div class="sub">Painel gerado por <b>scripts/build-dashboard.mjs</b> a partir de <b>frentes/**/status.json</b> · validado por schema.</div>
</div></header>

<main class="wrap">
  <div id="kpis" class="kpis"></div>
  <div class="sec-head">
    <h2>Frentes</h2>
    <span class="note" id="ordnote">ordenadas por score</span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="error"></div>
</main>

<footer class="wrap" style="display:flex">
  <span>samais · gestão + saúde</span>
  <span id="genstamp"></span>
</footer>

<script>
const BRL = n => n==null ? null : "R$ " + Number(n).toLocaleString("pt-BR");
const BRLc = n => n==null ? null : "R$ " + (Number(n)/1e6).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " mi";
/** Frente contratada mostra quanto falta para o dia 1 — é o dado que manda na operação. */
const implBadge = f => {
  if(!f.implantacao_em) return "";
  const dias = Math.round((Date.parse(f.implantacao_em+"T00:00:00Z") - Date.parse(new Date().toISOString().slice(0,10)+"T00:00:00Z"))/86400000);
  const br = f.implantacao_em.slice(0,10).split("-").reverse().join("/");
  return `<span class="impl" title="implantação prevista em ${br}">implanta em ${dias} d <small>· ${br}</small></span>`;
};
const stageLabel = s => ({"radar":"radar","varredura":"varredura","estudo":"estudo","proposta":"proposta","negociacao":"negociação","contratado":"contratado","contrato-ativo":"contrato ativo","arquivada":"arquivada"}[s]||s);

fetch("./data.json").then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(render)
  .catch(e=>{
    document.getElementById("error").innerHTML =
      '<div class="err">Não consegui carregar <b>data.json</b> ('+e.message+').<br>'+
      'Rode <b>node scripts/build-dashboard.mjs</b> e sirva a pasta por HTTP '+
      '(ex.: <b>npx serve dashboard</b>) — abrir via file:// bloqueia o fetch.</div>';
  });

function render(d){
  const kpis=[
    ["Frentes no radar", d.total_frentes],
    ["Contratos ativos", d.contratos_ativos],
    ["Pipeline mensal (base)", BRLc(d.pipeline_mensal)],
    ["Pipeline anual (base)", BRLc(d.pipeline_anual)],
  ];
  document.getElementById("kpis").innerHTML = kpis.map(([l,v])=>
    `<div class="kpi"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join("");

  document.getElementById("grid").innerHTML = d.frentes.map(f=>{
    const val = f.valor_contratual_mensal
      ? `<div class="fr-val">${BRL(f.valor_contratual_mensal)}<small> /mês · Cenário Base</small></div>`
      : `<div class="fr-val na">valor a dimensionar</div>`;
    const verdict = f.verdict ? `<span class="verdict" data-v="${f.verdict}">${f.verdict.replace("-"," ")}</span>` : "";
    return `<div class="fr">
      <div class="fr-top">
        <div class="fr-name">${f.frente}</div>
        <div class="fr-uf">${f.uf}</div>
      </div>
      <span class="fr-serv">${f.servico}</span>
      ${val}
      <div class="fr-row">
        <span class="stage" data-s="${f.estagio}">${stageLabel(f.estagio)}</span>
        ${implBadge(f)}
        <span class="gauge"><span class="bar"><span class="fill" style="width:${(f.score/10*100).toFixed(0)}%"></span></span><span class="n">${f.score.toFixed(1)}</span></span>
      </div>
      ${verdict?`<div class="fr-row"><span></span>${verdict}</div>`:""}
      <div class="next"><b>Próximo passo:</b> ${f.proximo_passo}</div>
    </div>`;
  }).join("");

  document.getElementById("genstamp").textContent = "gerado em " + d.gerado_em;
}
</script>
</body>
</html>
