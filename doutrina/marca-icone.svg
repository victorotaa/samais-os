<!-- Ícone canônico da marca Samais — usado como ícone de app (PWA), favicon e
     apple-touch-icon. Tokens de doutrina/samais.css: fundo #0A0A0A, ouro #B8954E→#D4B373,
     display Syne. Monograma SA+, que é a marca no mobile (a marca não some, colapsa).
     Distribuído pelo build para cada superfície do bundle — não duplicar à mão. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E7238"/>
      <stop offset=".5" stop-color="#B8954E"/>
      <stop offset="1" stop-color="#D4B373"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".5" cy=".18" r=".85">
      <stop offset="0" stop-color="#B8954E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#B8954E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>
  <rect width="512" height="512" rx="112" fill="url(#brilho)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none"
        stroke="#FFFFFF" stroke-opacity=".12" stroke-width="3"/>
  <text x="256" y="322" font-family="Syne, 'Arial Black', Helvetica, sans-serif" font-weight="800"
        font-size="196" fill="url(#ouro)" text-anchor="middle" letter-spacing="-8">SA+</text>
  <rect x="146" y="368" width="220" height="8" rx="4" fill="#B8954E" fill-opacity=".5"/>
</svg>
